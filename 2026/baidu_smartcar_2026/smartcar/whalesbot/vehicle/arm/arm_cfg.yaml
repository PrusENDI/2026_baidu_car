    - -0.2
    - 0.2
  threshold:
  - 0
  # 同步自 Orin 2026-07-23 实测行程：全局水平位置上限为 0.255 m。
  # 本地越界检查继续生效；仍请求 0.30 m 的任务会返回失败，调用方应据此停止后续动作。
  - 0.255
  homing:
    # 临时跳过 X 轴微动开关，使用编码器持续停滞判定机械回收端。
    # 微动开关恢复后改回 true，即可重新启用触发、消抖和释放确认。
    use_limit_switch: false
    limit_port: 3
    active: above
    threshold: 2000
    stable_samples: 5
    speed: 0.06
    timeout: 8.0
    safe_position: 0.015
