mode: paddle
draw_threshold: 0.5
metric: COCO
use_dynamic_shape: false
arch: YOLO
min_subgraph_size: 3
Preprocess:
- interp: 2
  keep_ratio: false
  target_size:
  - 640
  - 640
  type: Resize
- mean:
  # 与 submission-8-2/predict.py 保持一致：RGB 图像先 /255，再执行
  # ImageNet mean/std 归一化。YoloeInfer 已负责把 BGR 转换为 RGB。
  - 0.485
  - 0.456
  - 0.406
  norm_type: mean_std
  std:
  - 0.229
  - 0.224
  - 0.225
  type: NormalizeImage
- type: Permute
label_list:
- animal
- ball_blue
- ball_yellow
- cylinder_1
- cylinder_2
- cylinder_3
- cylinder_set
- h_dou_jiao
- h_fan_qie
- h_jin_zhen_gu
- h_mo_gu
- h_qin_cai
- h_qing_jiao
- h_tu_dou
- h_xi_lan_hua
- h_you_cai
- water
- water_l1
- water_l2
- water_l3
- yellow_tower
